[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-design-lab"
version = "0.3.0"
description = "Reproducible multirotor design experiments"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<0.116", "pydantic>=2.10,<3", "uvicorn>=0.32,<0.35", "numpy>=2.1,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<0.29"]

[tool.setuptools.packages.find]
where = ["apps/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/backend"]
